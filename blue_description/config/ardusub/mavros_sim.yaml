mavros:
  ros__parameters:
    system_id: 255
    plugin_allowlist:
      - sys_status
      - command
      - imu
      - rc_io
      - param
      - local*
      - global_position
      - mavros_sensor
      - setpoint_*
      - heartbeat
      - odometry*
      - manual_control
    mavros_sensor:
      sensor_topic: "/sensors/generalized_sensor_test"
      mavros_topic: "/mavros/custom_vision_speed/speed_twist"
      publish_mavlink: false

mavros_node:
  ros__parameters:
    fcu_url: "tcp://localhost"
    gcs_url: "udp://@localhost:14550"

mavros/local_position:
  ros__parameters:
    frame_id: "map"
    tf:
      send: false
